<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Formatting</title>
</head>

<body>

    <h1>My Website</h1>
    <h2>About Me</h2>
    <h3>My Education</h3>
    <h4>My Skills</h4>
    <h5>My Hobbies</h5>
    <h6>Contact Information</h6>

    <hr>

    <p>
        Hello! My name is Rohit.<br>
        I am learning <strong>HTML</strong> and <em>Java</em>
    </p>

    <p>
        I enjoy <strong>programming</strong> and <em>web development</em>.
    </p>

</body>

</html>
